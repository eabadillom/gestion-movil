name: gestion_movil
description: "Sistema para la gestion de inventarios en movil."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  formz: ^0.8.0
  intl: ^0.20.2
  go_router: ^14.8.1
  google_fonts: ^4.0.5
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.4.9
  logging: ^1.2.0
  font_awesome_flutter: ^10.8.0
  flutter_bloc: ^8.1.5
  multi_select_flutter: ^4.1.3
  path_provider: ^2.1.5
  printing: ^5.12.1
  pdf: ^3.12.0
  percent_indicator: ^4.2.3
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  flutter_media_store: ^1.3.1
  flutter_animate: ^4.5.0
  decimal: ^3.0.2
  device_info_plus: ^12.4.0

dev_dependencies:
  change_app_package_name: ^1.5.0 
  flutter_launcher_icons: "^0.12.0"
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/ferbo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "0x3833CDFF"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/gifs/
    - assets/images/
    - assets/icons/
    - assets/google_fonts/montserrat_alternates/
